<style>
        body {
            background-color: #faf8ff;
            background-image: 
                radial-gradient(at 0% 0%, hsla(221, 83%, 93%, 1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(220, 80%, 96%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(221, 83%, 93%, 1) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom input focus ring to match brand colors */
        .brand-focus:focus {
            outline: none;
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #004ac6;
        }
    </style>

<body class="font-body-md text-on-surface p-md">
<!-- Login Container -->
<main class="w-full max-w-[520px] mx-auto animate-in fade-in duration-700">
<!-- Top Branding Section -->
<div class="flex flex-col items-center mb-xl">
<div class="mb-lg bg-primary-container p-sm rounded-xl shadow-lg">
<span class="material-symbols-outlined text-white text-[48px]" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">ScholarSync</h1>
<p class="font-body-md text-secondary mt-xs">Academic Administration Portal</p>
</div>
<!-- Login Card -->
<section class="glass-panel border border-outline-variant rounded-[24px] p-xl shadow-[0px_4px_6px_-1px_rgba(0,0,0,0.1),0px_2px_4px_-2px_rgba(0,0,0,0.05)] overflow-hidden relative">
<!-- Subtle background pattern -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#004ac6 1px, transparent 1px); background-size: 20px 20px;"></div>
<div class="relative z-10">
<header class="mb-lg">
<h2 class="font-title-md text-title-md text-on-surface">Sign In</h2>
<p class="font-body-md text-on-surface-variant">Enter your credentials to manage your academic ecosystem.</p>
</header>
<form class="space-y-lg">
<!-- Identity Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-secondary" for="identity">Email or Mobile Number</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">alternate_email</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-on-surface focus:border-primary brand-focus transition-all placeholder:text-outline-variant" id="identity" placeholder="admin@scholarsync.edu" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-secondary" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-on-surface focus:border-primary brand-focus transition-all placeholder:text-outline-variant" id="password" placeholder="••••••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Policy -->
<div class="flex items-center gap-sm py-xs">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer" for="remember">Keep me signed in for 30 days</label>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-[#003ea8] text-white py-4 rounded-xl font-headline-md text-[18px] shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Footer Info -->
<div class="mt-xl pt-lg border-t border-outline-variant flex flex-col gap-md">
<p class="font-body-md text-on-surface-variant text-center">
                        Don't have an institutional account? 
                        <a class="text-primary font-semibold hover:underline" href="#">Contact Registry</a>
</p>
</div>
</div>
</section>
<!-- Footer Help -->
<footer class="mt-lg flex justify-between items-center px-sm">
<p class="font-label-md text-label-md text-outline">© 2024 ScholarSync Inc.</p>
<div class="flex gap-lg">
<a class="font-label-md text-label-md text-outline hover:text-secondary" href="#">Privacy</a>
<a class="font-label-md text-label-md text-outline hover:text-secondary" href="#">Security</a>
<a class="font-label-md text-label-md text-outline hover:text-secondary" href="#">Support</a>
</div>
</footer>
</main>
<!-- Visual Element: Background Image (Tablet Specific Context) -->
<div class="fixed bottom-0 right-0 w-[400px] h-[400px] opacity-10 pointer-events-none hidden lg:block">
<img class="w-full h-full object-contain" data-alt="A sophisticated 3D abstract architectural render of a modern library atrium with glass walls and floating platforms. The lighting is clean, bright, and professional, reflecting a high-tech academic environment. The color palette consists of soft blues, crisp whites, and deep navy accents to match a premium corporate UI aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCUUn0oNEV-kCBB1tAxTCpJpud5CCuxz2CucZleEMK40cxMM7hCqc15IWJG7bVCxVuhz1q3qpv-GiCsS6NOZPuykbDUNdJhpGuV1K745iIkNi_N7PBz2Sp9D98f88Wim0awfsCYE7jBxLa-YsBrMNuDFqRtSwDlBoiX3H0bnMENtCjU3bg4bD4hzs1uWhw-3sqy49uLVwvD-3BJwbP0WIW309zVM9JURWdebxbCQ92vRRPtOOjN71XMdukjzCehCV0XhQZ2Thxg9agO"/>
</div>
<script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                pwd.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Add a subtle parallax effect to the card on mouse move
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('section');
            if (!card) return;
            
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Form submission micro-interaction
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined">sync</span>';
            btn.disabled = true;
            btn.style.opacity = '0.7';
            
            setTimeout(() => {
                btn.innerHTML = 'Success';
                btn.classList.replace('bg-primary', 'bg-emerald-600');
                setTimeout(() => {
                    // Simulating a redirect or reset
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-emerald-600', 'bg-primary');
                    btn.disabled = false;
                    btn.style.opacity = '1';
                }, 2000);
            }, 1500);
        });
    </script>
</body></html>
